<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>단풍현상 관찰 학습</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🍁 단풍현상 관찰 학습</h1>
    <p>아래 이미지를 관찰하고, 오른쪽 채팅창에 관찰한 사실이나 궁금한 점을 적어보세요.</p>
  </header>

  <main class="app-main">
    <section class="image-panel">
      <div class="main-image-wrap">
        <img id="main-image" src="images/leaf1.jpg" alt="선택된 단풍 이미지" />
      </div>
      <div class="thumbnail-row" id="thumbnail-row">
        <!-- 썸네일은 script.js에서 자동 생성 -->
      </div>
      <p class="hint">※ 이미지를 클릭하면 그 이미지에 대해 AI와 대화할 수 있어요.</p>
    </section>

    <section class="chat-panel">
      <div class="chat-log" id="chat-log">
        <div class="msg msg-ai">
          안녕하세요! 지금 보고 있는 단풍 이미지에 대해 관찰한 내용을 자유롭게 적어보세요.
          궁금한 점을 질문해도 좋아요.
        </div>
      </div>
      <form id="chat-form" class="chat-input-row">
        <textarea id="chat-input" placeholder="관찰한 내용이나 질문을 입력하세요... (Enter 전송, Shift+Enter 줄바꿈)" rows="2" required></textarea>
        <button type="submit" id="send-btn">전송</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

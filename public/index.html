<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>단풍현상 관찰 학습</title>
<link rel="stylesheet" href="style.css?v=10" />
</head>
<body class="mode-assess">
  <header class="app-header">
    <div class="header-top">
      <h1>🍁 단풍현상 관찰 학습</h1>
      <nav class="lesson-tabs" role="tablist" aria-label="관찰 학습 탭">
        <button type="button" class="lesson-tab" role="tab" data-mode="assess" aria-selected="true">탭 1 관찰하기</button>
        <button type="button" class="lesson-tab" role="tab" data-mode="offload" aria-selected="false">탭 2 AI와 관찰하기</button>
        <button type="button" class="lesson-tab" role="tab" data-mode="support" aria-selected="false">탭 3 AI 도우미와 관찰하기</button>
      </nav>
      <div class="timer" id="timer" aria-live="off" title="제한 시간">제한 없음</div>
    </div>
    <p id="lesson-subtitle"></p>
  </header>

  <div class="student-id-bar" id="student-id-bar">
    <label for="student-id-input">학번(학생 번호)</label>
    <input type="text" id="student-id-input" placeholder="예: 1-05" />
    <button type="button" id="student-id-save-btn">확인</button>
    <span class="student-id-status" id="student-id-status">학번을 입력하고 확인을 눌러주세요.</span>
  </div>
  <div class="notice" id="notice" hidden></div>

  <main class="app-main">
    <section class="image-panel" id="image-panel">
      <div class="measure-tools" id="measure-tools">
        <button type="button" class="measure-toggle" id="measure-toggle" aria-expanded="false" aria-controls="measure-toolbar-wrap">
          관찰 도구
        </button>
        <div class="measure-toolbar-wrap" id="measure-toolbar-wrap" hidden>
          <div class="measure-toolbar" id="measure-toolbar">
            <button type="button" class="tool-btn active" id="tool-select" data-tool="select">선택</button>
            <button type="button" class="tool-btn" id="tool-ruler" data-tool="ruler">자</button>
            <button type="button" class="tool-btn" id="tool-protractor" data-tool="protractor">각도기</button>
            <button type="button" class="tool-btn" id="tool-undo">마지막 지우기</button>
            <button type="button" class="tool-btn" id="tool-clear">모두 지우기</button>
            <button type="button" class="tool-btn" id="tool-to-chat">문장 입력란에 넣기</button>
          </div>
          <p class="measure-status" id="measure-status">도구를 고른 뒤 사진 위를 클릭하세요. 길이는 화면 기준 상대값이고, 각도는 실제 각도(°)입니다.</p>
        </div>
      </div>
      <script type="application/json" id="measure-i18n">
      {
        "idle": "도구를 고른 뒤 사진 위를 클릭하세요. 길이는 화면 기준 상대값이고, 각도는 실제 각도(°)입니다.",
        "rulerStart": "자: 사진에서 첫 번째 점을 클릭하세요. (두 점으로 상대 길이를 잽니다)",
        "rulerNext": "자: 두 번째 점을 클릭하면 길이가 표시됩니다.",
        "rulerDone": "길이 측정이 추가되었습니다. 계속 재려면 두 점을 다시 클릭하세요.",
        "angleStart": "각도기: 각의 한쪽 끝점을 클릭하세요. 두 번째는 꼭짓점, 세 번째는 다른 쪽 끝점입니다.",
        "angleVertex": "각도기: 꼭짓점(각의 가운데)을 클릭하세요.",
        "angleNext": "각도기: 다른 쪽 끝점을 클릭하면 각도가 표시됩니다.",
        "angleDone": "각도 측정이 추가되었습니다. 계속 재려면 세 점을 다시 클릭하세요.",
        "outside": "사진 안의 잎 위를 클릭하세요. (여백은 측정되지 않습니다)",
        "undone": "마지막 측정을 지웠습니다.",
        "cleared": "측정값을 모두 지웠습니다.",
        "emptyChat": "입력란에 넣을 측정값이 없습니다. 먼저 자나 각도기로 재어 보세요.",
        "chatHeader": "[관찰 도구]",
        "chatDone": "측정값을 관찰 문장 입력란에 넣었습니다. 문장으로 다듬어 추가하세요.",
        "labelLength": "사진{slot} 자: 상대 길이 {value}",
        "labelAngle": "사진{slot} 각도기: {value}°"
      }
      </script>
      <div class="main-image-wrap" id="main-image-wrap">
        <div class="image-slot" id="image-slot-1">
          <img id="main-image" src="images/l2-05.jpg" alt="관찰할 단풍잎 사진" />
          <svg class="measure-overlay" id="overlay-1" data-slot="1" preserveAspectRatio="none"></svg>
        </div>
        <div class="image-slot hidden" id="image-slot-2">
          <img id="compare-image" src="" alt="" />
          <svg class="measure-overlay" id="overlay-2" data-slot="2" preserveAspectRatio="none"></svg>
        </div>
      </div>
      <div class="image-picker" id="image-picker" role="group" aria-label="관찰할 사진 고르기"></div>
      <ul class="measure-list" id="measure-list"></ul>
      <p class="hint" id="lesson-hint"></p>
    </section>

    <section class="chat-panel" id="side-panel">
      <div class="start-card" id="start-card">
        <h2 id="start-title"></h2>
        <p id="start-desc"></p>
        <button type="button" id="start-btn">시작하기</button>
        <p class="start-msg" id="start-msg"></p>
      </div>

      <div class="work-area" id="work-area" hidden>
        <div class="chat-section" id="chat-section">
          <div class="chat-log" id="chat-log"></div>
          <form id="chat-form" class="chat-input-row">
            <textarea id="chat-input" placeholder="" rows="2" required></textarea>
            <button type="submit" id="send-btn">전송</button>
          </form>
        </div>

        <div class="sentence-section" id="sentence-section">
          <div class="sentence-head">
            <h3>내 관찰 문장 <span id="sentence-count">0</span>개</h3>
            <span class="sentence-tip" id="sentence-tip"></span>
          </div>
          <ol class="sentence-list" id="sentence-list"></ol>
          <form id="sentence-form" class="sentence-input-row">
            <textarea id="sentence-input" rows="2" placeholder="관찰한 내용을 한 문장씩 입력하세요. (Enter 추가, Shift+Enter 줄바꿈)"></textarea>
            <button type="submit" id="sentence-add-btn">추가</button>
          </form>
          <div class="submit-row">
            <span class="submit-status" id="submit-status"></span>
            <button type="button" id="submit-btn">최종 제출</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js?v=12"></script>
  <script src="measure.js?v=4"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>단풍현상 관찰 학습</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🍁 단풍현상 관찰 학습</h1>
    <p>아래 이미지를 관찰하고, 오른쪽 채팅창에 관찰한 사실이나 궁금한 점을 적어보세요.</p>
  </header>

  <div class="student-id-bar" id="student-id-bar">
    <label for="student-id-input">학번(학생 번호)</label>
    <input type="text" id="student-id-input" placeholder="예: 1-05" />
    <button type="button" id="student-id-save-btn">확인</button>
    <span class="student-id-status" id="student-id-status">학번을 입력하고 확인을 눌러주세요.</span>
  </div>

  <main class="app-main">
    <section class="image-panel">
      <div class="main-image-wrap" id="main-image-wrap">
        <div class="image-slot" id="image-slot-1">
          <img id="main-image" src="images/leaf1.jpg" alt="선택된 단풍 이미지 1" />
        </div>
        <div class="image-slot hidden" id="image-slot-2">
          <img id="compare-image" src="" alt="선택된 단풍 이미지 2" />
        </div>
      </div>
      <div class="thumbnail-row" id="thumbnail-row">
        <!-- 썸네일은 script.js에서 자동 생성 -->
      </div>
      <p class="hint">※ 이미지를 클릭해서 선택하세요. 사진을 2장 선택하면 두 사진을 나란히 놓고 비교 관찰할 수 있어요.</p>
    </section>

    <section class="chat-panel">
      <div class="chat-log" id="chat-log">
        <div class="msg msg-ai">
          안녕하세요! 지금 보고 있는 단풍 이미지에 대해 관찰한 내용을 자유롭게 적어보세요.
          궁금한 점을 질문해도 좋아요.
        </div>
      </div>
      <form id="chat-form" class="chat-input-row">
        <textarea id="chat-input" placeholder="관찰한 내용이나 질문을 입력하세요... (Enter 전송, Shift+Enter 줄바꿈)" rows="2" required></textarea>
        <button type="submit" id="send-btn">전송</button>
      </form>
      <div class="history-actions">
        <span class="history-label">내 대화 기록 다운로드:</span>
        <button type="button" id="download-xlsx-btn">📊 엑셀(.xlsx)</button>
        <button type="button" id="download-docx-btn">📄 워드(.docx)</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
